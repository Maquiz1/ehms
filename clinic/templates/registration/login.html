<!-- This is the login page for the hospital staff -->
<!-- The form is similar to the sign up page -->
<!-- The form is submitted to the same URL as the sign up page -->
<!DOCTYPE html>
{% load static %}
<html lang="en">

  
<!-- Mirrored from bootstrapget.com/demos/medflex-medical-admin-template/login.html by HTTrack Website Copier/3.x [XR&CO'2014], Wed, 12 Mar 2025 16:01:44 GMT -->
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ehms - Login</title>

    <!-- Meta -->
    <meta name="description" content="Marketplace for Bootstrap Admin Dashboards">
    <meta property="og:title" content="Admin Templates - Dashboard Templates">
    <meta property="og:description" content="Marketplace for Bootstrap Admin Dashboards">
    <meta property="og:type" content="Website">
    <link rel="shortcut icon" href="{% static 'assets/images/favicon.svg' %}">

    <!-- *************
			************ CSS Files *************
		************* -->
    <link rel="stylesheet" href="{% static 'assets/fonts/remix/remixicon.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/main.min.css' %}">

  </head>

  <body class="login-bg">

    <!-- Container starts -->
    <div class="container">

      <!-- Auth wrapper starts -->
      <div class="auth-wrapper">

        <!-- Form starts -->
        <form method="post" action="{% url 'login' %}">
        <!-- <form action="https://bootstrapget.com/demos/medflex-medical-admin-template/index.html"> -->
            {% csrf_token %}
          <div class="auth-box">
            <a href="index-2.html" class="auth-logo mb-4">
              <img src="{% static 'assets/images/logo-dark.svg' %}" alt="Bootstrap Gallery">
            </a>

            <h4 class="mb-4">Login</h4>
            {{ form.non_field_errors }}
            <div class="mb-3">
                <label class="form-label" for="username">Your username <span class="text-danger">*</span></label>
                {{ form.username }}
            </div>
            <!-- <div class="mb-3">
              <label class="form-label" for="email">Your email <span class="text-danger">*</span></label>
              {{ form.email }} -->
              <!-- <input type="text" id="email" class="form-control" placeholder="Enter your email"> -->
            <!-- </div> -->

            <div class="mb-2">
              <label class="form-label" for="password">Your password <span class="text-danger">*</span></label>
              <div class="input-group">
                {{ form.password }}
                <!-- <input type="password" id="password" class="form-control" placeholder="Enter password"> -->
                <button class="btn btn-outline-secondary" type="button">
                  <i class="ri-eye-line text-primary"></i>
                </button>
              </div>
            </div>

            <div class="d-flex justify-content-end mb-3">
              <a href="forgot-password.html" class="text-decoration-underline">Forgot password?</a>
            </div>

            <div class="mb-3 d-grid gap-2">
                <input type="hidden" name="next" value="{% url 'hospital-dashboard' %}" />
              <!-- <button type="submit" class="btn btn-primary">Login</button> -->
              <input type="submit" class="btn btn-primary" value="Login" />
              <a href="{% url 'sign_up' %}" class="btn btn-secondary">Not registered? Signup</a>
            </div>

          </div>

        </form>
        <!-- Form ends -->

      </div>
      <!-- Auth wrapper ends -->

    </div>
    <!-- Container ends -->

  </body>


<!-- Mirrored from bootstrapget.com/demos/medflex-medical-admin-template/login.html by HTTrack Website Copier/3.x [XR&CO'2014], Wed, 12 Mar 2025 16:01:45 GMT -->
</html>
