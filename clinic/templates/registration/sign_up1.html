<!DOCTYPE html>
{% load static %}
<html lang="en">

  
<!-- Mirrored from bootstrapget.com/demos/medflex-medical-admin-template/signup.html by HTTrack Website Copier/3.x [XR&CO'2014], Wed, 12 Mar 2025 16:04:36 GMT -->
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap Gallery - Medical Admin Templates & Dashboards</title>

    <!-- Meta -->
    <meta name="description" content="Marketplace for Bootstrap Admin Dashboards">
    <meta property="og:title" content="Admin Templates - Dashboard Templates">
    <meta property="og:description" content="Marketplace for Bootstrap Admin Dashboards">
    <meta property="og:type" content="Website">
    <link rel="shortcut icon" href="{% static 'assets/images/favicon.svg' %}">

    <!-- *************
			************ CSS Files *************
		************* -->
    <link rel="stylesheet" href="{% static 'assets/fonts/remix/remixicon.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/main.min.css' %}">

  </head>

  <body class="login-bg">

    <!-- Container starts -->
    <div class="container">

      <!-- Auth wrapper starts -->
      <div class="auth-wrapper">

        <!-- Form starts -->
        <form action="https://bootstrapget.com/demos/medflex-medical-admin-template/index.html">

          <div class="auth-box">
            <a href="index-2.html" class="auth-logo mb-4">
              <img src="{% static 'assets/images/logo-dark.svg' %}"> alt="Bootstrap Gallery">
            </a>

            <h4 class="mb-4">Signup</h4>

            <div class="mb-3">
              <label class="form-label" for="name">Your name <span class="text-danger">*</span></label>
              <input type="text" id="name" class="form-control" placeholder="Enter your name">
            </div>

            <div class="mb-3">
              <label class="form-label" for="email">Your email <span class="text-danger">*</span></label>
              <input type="text" id="email" class="form-control" placeholder="Enter your email">
            </div>

            <div class="mb-3">
              <label class="form-label" for="pwd">Your password <span class="text-danger">*</span></label>
              <div class="input-group">
                <input type="password" id="pwd" class="form-control" placeholder="Enter password">
                <button class="btn btn-outline-secondary" type="button">
                  <i class="ri-eye-line text-primary"></i>
                </button>
              </div>
              <div class="form-text">
                Your password must be 8-20 characters long.
              </div>
            </div>

            <div class="mb-3 d-grid gap-2">
              <button type="submit" class="btn btn-primary">Signup</button>
              <a href="login.html" class="btn btn-secondary">Already have an account? Login</a>
            </div>

          </div>

        </form>
        <!-- Form ends -->

      </div>
      <!-- Auth wrapper ends -->

    </div>
    <!-- Container ends -->

  </body>


<!-- Mirrored from bootstrapget.com/demos/medflex-medical-admin-template/signup.html by HTTrack Website Copier/3.x [XR&CO'2014], Wed, 12 Mar 2025 16:04:36 GMT -->
</html>
